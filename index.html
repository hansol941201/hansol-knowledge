<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>한솔 지식 - 대시보드</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased">

  <!-- 헤더 -->
  <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 flex items-center justify-between h-14">
      <div class="flex items-center space-x-6">
        <div class="flex items-center space-x-2 font-bold text-lg text-slate-900">
          <span class="bg-slate-900 text-white text-xs px-2 py-1 rounded">HS</span>
          <span>한솔 지식</span>
        </div>
        <nav class="hidden md:flex space-x-4 text-sm font-medium text-gray-600">
          <a href="#" class="text-blue-600 border-b-2 border-blue-600 pb-4 pt-4 font-semibold">대시보드</a>
          <a href="#" class="hover:text-gray-900 pb-4 pt-4">내 지식</a>
          <a href="#" class="hover:text-gray-900 pb-4 pt-4">할 일</a>
          <a href="#" class="hover:text-gray-900 pb-4 pt-4">기억</a>
          <a href="#" class="hover:text-gray-900 pb-4 pt-4">특허</a>
          <a href="#" class="hover:text-gray-900 pb-4 pt-4">협력업체</a>
          <a href="#" class="hover:text-gray-900 pb-4 pt-4">계정</a>
          <a href="#" class="hover:text-gray-900 pb-4 pt-4">연락처</a>
          <a href="#" class="hover:text-gray-900 pb-4 pt-4">업무지식</a>
          <a href="#" class="hover:text-gray-900 pb-4 pt-4">대본</a>
          <a href="#" class="hover:text-gray-900 pb-4 pt-4">기획</a>
          <a href="#" class="hover:text-gray-900 pb-4 pt-4">기억 저장소</a>
        </nav>
      </div>
      <div class="flex items-center space-x-3">
        <button class="text-gray-500 hover:text-gray-700 p-1">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        </button>
        <div class="w-8 h-8 rounded-full bg-slate-400 text-white flex items-center justify-center font-semibold text-xs">H</div>
      </div>
    </div>
  </header>

  <!-- 서브 메뉴 -->
  <section class="bg-white border-b border-gray-200 py-3">
    <div class="max-w-7xl mx-auto px-4 overflow-x-auto">
      <div class="flex space-x-3 min-w-max">
        <button class="flex flex-col items-center justify-center w-20 h-16 bg-blue-50/50 hover:bg-blue-50 rounded-lg text-xs text-gray-700">
          <span class="text-blue-500 text-base mb-1">👥</span>
          POUR 협력사
        </button>
        <button class="flex flex-col items-center justify-center w-20 h-16 bg-emerald-50/50 hover:bg-emerald-50 rounded-lg text-xs text-gray-700">
          <span class="text-emerald-500 text-base mb-1">🧪</span>
          기술자료
        </button>
        <button class="flex flex-col items-center justify-center w-20 h-16 bg-orange-50/50 hover:bg-orange-50 rounded-lg text-xs text-gray-700">
          <span class="text-orange-500 text-base mb-1">👨‍👩‍👧</span>
          고객관리
        </button>
        <button class="flex flex-col items-center justify-center w-20 h-16 bg-amber-50/50 hover:bg-amber-50 rounded-lg text-xs text-gray-700">
          <span class="text-amber-500 text-base mb-1">📜</span>
          출원지식
        </button>
        <button class="flex flex-col items-center justify-center w-20 h-16 bg-blue-50/50 hover:bg-blue-50 rounded-lg text-xs text-gray-700">
          <span class="text-blue-600 text-base mb-1">📅</span>
          팀일정
        </button>
        <button class="flex flex-col items-center justify-center w-20 h-16 bg-rose-50/50 hover:bg-rose-50 rounded-lg text-xs text-gray-700">
          <span class="text-rose-500 text-base mb-1">❓</span>
          Q&A
        </button>
        <button class="flex flex-col items-center justify-center w-20 h-16 bg-emerald-50/50 hover:bg-emerald-50 rounded-lg text-xs text-gray-700">
          <span class="text-emerald-600 text-base mb-1">📆</span>
          영업운영
        </button>
        <button class="flex flex-col items-center justify-center w-20 h-16 bg-slate-100 hover:bg-slate-200 rounded-lg text-xs text-gray-700">
          <span class="text-slate-600 text-base mb-1">💼</span>
          B2B문서함
        </button>
      </div>
    </div>
  </section>

  <!-- 메인 레이아웃 -->
  <main class="max-w-7xl mx-auto px-4 py-6">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">
      
      <!-- 가운데/왼쪽: 전화 통화 실시간 메모 영역 -->
      <div class="lg:col-span-7 space-y-4">
        <div class="bg-white rounded-lg border border-gray-200 shadow-sm p-5">
          <div class="flex items-center justify-between mb-3">
            <h2 class="text-base font-bold text-gray-900 flex items-center space-x-2">
              <span>📞</span>
              <span>통화 &amp; 빠른 메모</span>
            </h2>
            <span class="text-xs text-gray-400">엔터(Enter)를 누르면 오른쪽 할 일로 자동 추가됩니다</span>
          </div>
          
          <div class="space-y-3">
            <div class="relative">
              <input type="text" id="quick-input" placeholder="통화 내용이나 할 일을 입력 후 엔터를 누르세요..." 
                class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all"
                onkeypress="if(event.key === 'Enter') { addTodoFromInput(); }">
              <button onclick="addTodoFromInput()" class="absolute right-2 top-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-3 py-1.5 rounded-md transition-colors">
                추가
              </button>
            </div>

            <div class="flex items-center justify-between text-xs text-gray-500 pt-1">
              <div class="flex items-center space-x-2">
                <label class="cursor-pointer flex items-center space-x-1 px-2.5 py-1.5 bg-gray-100 hover:bg-gray-200 rounded text-gray-600 transition-colors">
                  <span>📷</span>
                  <span>사진/파일 첨부</span>
                  <input type="file" class="hidden" accept="image/*" onchange="alert('사진이 첨부되었습니다.')">
                </label>
              </div>
              <span class="text-[11px] text-gray-400">Tip: Shift + Enter로 줄바꿈</span>
            </div>

            <!-- 메모 작성 란 (자유 메모) -->
            <div class="pt-2">
              <label class="block text-xs font-semibold text-gray-600 mb-1">상세 메모 / 통화 기록</label>
              <textarea placeholder="전화 통화 중 상세 내용을 메모해두세요..." class="w-full h-40 p-3 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white resize-none"></textarea>
            </div>
          </div>
        </div>
      </div>

      <!-- 오른쪽: 통일된 단일 할 일(To-Do) 목록 -->
      <div class="lg:col-span-5 space-y-4">
        <div class="bg-white rounded-lg border border-gray-200 shadow-sm p-4 space-y-4">
          <div class="flex items-center justify-between border-b pb-3">
            <h3 class="text-sm font-bold text-gray-900 flex items-center space-x-1.5">
              <span>✅</span>
              <span>할 일 목록</span>
            </h3>
            <span id="todo-count" class="text-xs bg-blue-100 text-blue-800 font-bold px-2 py-0.5 rounded-full">11개</span>
          </div>

          <ul id="todo-list" class="space-y-2 text-xs divide-y divide-gray-100">
            <li class="flex items-center justify-between pt-2">
              <label class="flex items-center space-x-2 truncate cursor-pointer">
                <input type="checkbox" class="w-4 h-4 text-blue-600 rounded border-gray-300">
                <span class="truncate text-gray-700 text-sm">동영상 1차 시안 제작</span>
              </label>
              <button onclick="this.parentElement.remove()" class="text-gray-400 hover:text-red-500 text-xs ml-2">✕</button>
            </li>
            <li class="flex items-center justify-between pt-2">
              <label class="flex items-center space-x-2 truncate cursor-pointer">
                <input type="checkbox" class="w-4 h-4 text-blue-600 rounded border-gray-300">
                <span class="truncate text-gray-700 text-sm">고객관리카드 수정하기</span>
              </label>
              <button onclick="this.parentElement.remove()" class="text-gray-400 hover:text-red-500 text-xs ml-2">✕</button>
            </li>
            <li class="flex items-center justify-between pt-2">
              <label class="flex items-center space-x-2 truncate cursor-pointer">
                <input type="checkbox" class="w-4 h-4 text-blue-600 rounded border-gray-300">
                <span class="truncate text-gray-700 text-sm">입주박스기업 1차미팅</span>
              </label>
              <button onclick="this.parentElement.remove()" class="text-gray-400 hover:text-red-500 text-xs ml-2">✕</button>
            </li>
            <li class="flex items-center justify-between pt-2">
              <label class="flex items-center space-x-2 truncate cursor-pointer">
                <input type="checkbox" class="w-4 h-4 text-blue-600 rounded border-gray-300">
                <span class="truncate text-gray-700 text-sm">우단건설, 은화 미열 건음 확인해보기</span>
              </label>
              <button onclick="this.parentElement.remove()" class="text-gray-400 hover:text-red-500 text-xs ml-2">✕</button>
            </li>
            <li class="flex items-center justify-between pt-2">
              <label class="flex items-center space-x-2 truncate cursor-pointer">
                <input type="checkbox" class="w-4 h-4 text-blue-600 rounded border-gray-300">
                <span class="truncate text-gray-700 text-sm">명품건설 결론지</span>
              </label>
              <button onclick="this.parentElement.remove()" class="text-gray-400 hover:text-red-500 text-xs ml-2">✕</button>
            </li>
            <li class="flex items-center justify-between pt-2">
              <label class="flex items-center space-x-2 truncate cursor-pointer">
                <input type="checkbox" class="w-4 h-4 text-blue-600 rounded border-gray-300">
                <span class="truncate text-gray-700 text-sm">수진님 비교표 만들어서 올리기</span>
              </label>
              <button onclick="this.parentElement.remove()" class="text-gray-400 hover:text-red-500 text-xs ml-2">✕</button>
            </li>
            <li class="flex items-center justify-between pt-2">
              <label class="flex items-center space-x-2 truncate cursor-pointer">
                <input type="checkbox" class="w-4 h-4 text-blue-600 rounded border-gray-300">
                <span class="truncate text-gray-700 text-sm">전열콘도 비교표 보강수명,설치비용 보내기</span>
              </label>
              <button onclick="this.parentElement.remove()" class="text-gray-400 hover:text-red-500 text-xs ml-2">✕</button>
            </li>
            <li class="flex items-center justify-between pt-2">
              <label class="flex items-center space-x-2 truncate cursor-pointer">
                <input type="checkbox" class="w-4 h-4 text-blue-600 rounded border-gray-300">
                <span class="truncate text-gray-700 text-sm">클로드 비번 계정 물어보기</span>
              </label>
              <button onclick="this.parentElement.remove()" class="text-gray-400 hover:text-red-500 text-xs ml-2">✕</button>
            </li>
          </ul>
        </div>

        <!-- 일정 카드 -->
        <div class="bg-white rounded-lg border border-gray-200 shadow-sm p-4">
          <div class="flex items-center justify-between mb-3">
            <h4 class="text-xs font-bold text-gray-900">일정</h4>
            <a href="#" class="text-[11px] text-gray-400 hover:text-gray-600">더보기 &gt;</a>
          </div>
          <div class="space-y-3">
            <div>
              <div class="flex items-center space-x-2 mb-1">
                <span class="text-xs font-bold text-gray-800">9월 7일 (월)</span>
                <span class="px-1.5 py-0.5 text-[10px] bg-emerald-50 text-emerald-600 font-semibold rounded">오늘 2건</span>
              </div>
              <div class="bg-gray-50 p-2.5 rounded border border-gray-100 flex items-start space-x-2">
                <span class="px-2 py-0.5 rounded bg-blue-100 text-blue-700 text-[10px] font-bold font-mono shrink-0">09:00</span>
                <div class="text-xs min-w-0">
                  <p class="font-bold text-gray-800 truncate">2차미팅 수지씨앤에스</p>
                  <p class="text-gray-400 text-[11px] mt-0.5">📍 회의실 A</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- 엔터 입력 시 할 일 추가 스크립트 -->
  <script>
    function addTodoFromInput() {
      const input = document.getElementById('quick-input');
      const text = input.value.trim();
      
      if (!text) return;

      const list = document.getElementById('todo-list');
      const li = document.createElement('li');
      li.className = 'flex items-center justify-between pt-2';
      li.innerHTML = `
        <label class="flex items-center space-x-2 truncate cursor-pointer">
          <input type="checkbox" class="w-4 h-4 text-blue-600 rounded border-gray-300">
          <span class="truncate text-gray-700 text-sm">${text}</span>
        </label>
        <button onclick="this.parentElement.remove()" class="text-gray-400 hover:text-red-500 text-xs ml-2">✕</button>
      `;

      list.insertBefore(li, list.firstChild);
      input.value = '';
    }
  </script>

</body>
</html>
