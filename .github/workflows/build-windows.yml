name: Build Windows app

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: hansol-knowledge-windows
          path: dist/*.exe
          if-no-files-found: error

      # 로그인 없이 exe 를 바로 받을 수 있도록 latest 릴리스로 올린다.
      # 주소는 항상 같다:
      # https://github.com/hansol941201/hansol-knowledge/releases/latest/download/hansol-knowledge.exe
      - name: Publish latest release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          built=$(ls dist/*.exe | head -1)
          cp "$built" dist/hansol-knowledge.exe
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/hansol-knowledge.exe \
            --title "한솔 지식창 최신 버전" \
            --notes "커밋 ${GITHUB_SHA:0:7} 자동 빌드. 받아서 기존 실행 파일과 바꿔 주세요."

