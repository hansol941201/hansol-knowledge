<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>할 일 알림</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#172b35;color:#f5f8fb;font:14px/1.5 system-ui;padding:18px}h1{font-size:18px;margin:0 0 4px}p{color:#c5d1d8;font-size:12px;margin:0 0 15px}main{max-height:400px;overflow:auto}label{display:flex;gap:10px;padding:13px 0;border-top:1px solid #51626b;cursor:pointer}input{width:20px;height:20px;flex-shrink:0}span{overflow-wrap:anywhere}time{display:block;font-size:12px;color:#e6c985}
</style></head><body><h1>할 일 알림</h1><p>완료 체크 전까지 이 창이 유지됩니다.</p><main id="rows"></main>
<script>
window.reminderAPI.onRows(rows => {
 const main = document.getElementById('rows'); main.replaceChildren();
 for(const row of rows){
  const label=document.createElement('label'); const check=document.createElement('input');check.type='checkbox';check.setAttribute('aria-label',row.text+' 완료');
  const text=document.createElement('span');text.textContent=row.text;const date=document.createElement('time');date.textContent=row.date;text.append(date);
  check.onchange=()=>window.reminderAPI.complete(row.id); label.append(check,text);main.append(label);
 }
});
</script></body></html>
